name: Release

# Spouští ho jen tag v* (např. v0.1.0), který vytvoří člověk.
# npm: trusted publishing přes OIDC, bez tokenu, provenance se přidá sama (veřejné repo).
# První verzi je potřeba publikovat ručně a na npmjs.com u balíčku nastavit tento workflow
# (release.yml) jako trusted publisher. Postup v docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      INSTADECK_CHROME_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing vyžaduje npm 11.5.1 a novější, Node 22 nese starší npm.
      - name: Newer npm for trusted publishing
        run: npm install -g "npm@>=11.5.1 <12"
      - run: npm ci
      - name: Version matches the tag
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm run typecheck
      - run: npm test
      - name: Package check
        run: node scripts/smoke-pack.mjs
      - name: Claude Desktop extension
        run: npm run bundle
      - name: GitHub Release with instadeck.mcpb
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist-bundle/instadeck.mcpb --title "${GITHUB_REF_NAME}" --generate-notes
      - name: Publish to npm
        run: npm publish --access public

  # Zápis do oficiálního MCP Registry (z něj čerpají PulseMCP a další katalogy).
  # Samostatná job po npm: registry ověřuje, že balíček s mcpName už na npm je.
  # Selhání jde spustit znovu bez nového publish na npm. Přihlášení přes OIDC, bez tokenu.
  registry:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Version in server.json from package.json
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          jq '{name, version, packages: [.packages[] | {identifier, version}]}' server.json
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Login with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
